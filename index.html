<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Online Shop</h1>
    </header>
    <main>
        <div class="products-container">
            <div class="product-card">
                <img src="laptop.jpg" alt="Laptop">
                <h3>Laptop</h3>
                <p class="price">$999</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card special-card">
                <img src="smart.jpg" alt="Smartphone">
                <h3>Smartphone</h3>
                <p class="price">$699</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="Headphones.jpg" alt="Headphones">
                <h3>Headphones</h3>
                <p class="price">$149</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="Smart Watch.jpg" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p class="price">$199</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card span-two">
                <img src="Keyboard.jpg" alt="Keyboard">
                <h3>Keyboard</h3>
                <p class="price">$89</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="Mouse.jpg" alt="Mouse">
                <h3>Mouse</h3>
                <p class="price">$49</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="Monitor.jpg" alt="Monitor">
                <h3>Monitor</h3>
                <p class="price">$299</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="Camera.jpg" alt="Camera">
                <h3>Camera</h3>
                <p class="price">$599</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 My Online Shop. All rights reserved.</p>
    </footer>

</body>
</html>
